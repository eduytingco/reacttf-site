<!-- Shared site header. Loaded into [data-include="header"] by src/main.ts -->
<header class="grid">
  <div class="header">
    <a class="brand" href="index.html" aria-label="REACT home" data-i18n-attr="aria-label:brand.home.label">
      <picture>
        <source type="image/webp"
                srcset="static/images/react-badge-64.webp 1x, static/images/react-badge-128.webp 2x, static/images/react-badge-192.webp 3x">
        <img class="badge" src="static/images/react-badge-128.png" width="64" height="64" alt="">
      </picture>
      <span class="brand-text">
        <span class="brand-name" data-i18n="brand.name">REACT</span>
        <span class="brand-tagline" data-i18n="brand.tagline">Regional Endorsement Allied Computer Team</span>
      </span>
    </a>

    <button class="menu-btn" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Open menu" data-i18n-attr="aria-label:nav.menu.open">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>

    <nav id="site-nav" class="site-nav" aria-label="Main" data-i18n-attr="aria-label:nav.label">
      <a href="index.html#about" data-i18n="nav.about">About</a>
      <div class="nav-dropdown">
        <button class="nav-dropdown-toggle" type="button" aria-expanded="false" data-i18n="nav.crimes">Crimes
          <svg class="nav-chevron" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="nav-submenu">
          <a href="page.html?page=high-crimes" data-i18n="crimes.highCrimes">High crimes</a>
          <a href="page.html?page=cryptocurrency-scam" data-i18n="crimes.cryptoScam">Cryptocurrency scam</a>
          <a href="page.html?page=pig-butchering" data-i18n="crimes.pigButchering">Pig butchering</a>
          <a href="page.html?page=identity-theft" data-i18n="crimes.identityTheft">ID theft</a>
        </div>
      </div>
      <a href="index.html#resources-title" data-i18n="nav.resources">Resources</a>
      <a href="index.html#contacts" data-i18n="nav.contacts">Contacts</a>
      <a href="media.html" data-i18n="nav.media">Media</a>
    </nav>

    <button class="search-toggle" type="button" aria-expanded="false" aria-label="Search" data-i18n-attr="aria-label:nav.search">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16.5 16.5L21 21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>

    <form class="search-bar" role="search" aria-label="Site search">
      <input class="search-input" type="search" placeholder="Search…" aria-label="Search the site">
      <button class="search-close" type="button" aria-label="Close search">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </form>
  </div>
</header>
