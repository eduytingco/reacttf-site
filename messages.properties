# ==========================================================================
#  REACT site copy
#  All user-facing text lives here. Keys are referenced from the HTML
#  (data-i18n="key"), static/data/pages.json (titleKey) and src/main.ts (t("key")).
#
#  Format: key=value  (Java .properties)
#  - Placeholders: {0}, {1}, ... are replaced at runtime.
#  - Saved as UTF-8, so characters like ©, · and ’ can be typed directly.
#    (\uXXXX escapes also work, e.g. \u00A9 = ©.)
#  - Translations: add messages_<lang>.properties (e.g. messages_es.properties)
#    with only the keys that differ; missing keys fall back to this file.
# ==========================================================================

