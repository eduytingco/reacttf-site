<!--
  Header and footer come from static/partials/ (shared with page.html).
  Text: every string below is a fallback. At runtime src/main.ts loads
  messages.properties and replaces it using the data-i18n keys:
    data-i18n="key"                 -> element text
    data-i18n-attr="attr:key, ..."  -> attribute values (e.g. aria-label)
    data-i18n-args="a, b"           -> fills {0}, {1}; "$year" = current year
-->

        </div>
        <button type="button" class="media-submit" id="upload-btn" disabled>Upload</button>

            </figcaption>

          <figure class="slide" role="group" aria-roledescription="slide" aria-label="3 of 6">

            </figcaption>
          </figure>
          <figure class="slide" role="group" aria-roledescription="slide" aria-label="4 of 6">
            <div class="slide-img s4"></div>

              <h3 data-i18n="carousel.slide4.headline">Slide 4 Headline</h3>
              <span data-i18n="carousel.slide4.caption">Tempor incididunt</span>

            </figcaption>
          </figure>
          <figure class="slide" role="group" aria-roledescription="slide" aria-label="5 of 6">

</div>

<script>
(function () {
  var AUTH_API = 'https://api.reacttf.org/auth.php';
  var loginSection = document.querySelector('.media-login-section');
  var formSection = document.querySelector('.media-form-section');
  var loginForm = document.getElementById('login-form');
  var loginMsg = document.getElementById('login-msg');
  var logoutBtn = document.getElementById('logout-btn');
  var wantsEdit = new URLSearchParams(window.location.search).has('edit');

  function parseJSON(res) {
    var ct = res.headers.get('content-type') || '';
    if (!ct.includes('application/json')) {
      throw new Error('Server did not return JSON.');
    }
    return res.json().then(function (body) {
      if (!res.ok) throw new Error(body.error || 'Server error');
      return body;
    });
  }

  function enableEditMode() {
    loginSection.setAttribute('hidden', '');
    formSection.removeAttribute('hidden');
  }

  function showLogin() {
    loginSection.removeAttribute('hidden');
  }

  if (wantsEdit) {
    fetch(AUTH_API, { credentials: 'include' })
      .then(parseJSON)
      .then(function (data) {
        if (data.authenticated) enableEditMode();
        else showLogin();
      })
      .catch(function () { showLogin(); });
  }

  loginForm.addEventListener('submit', function (e) {
    e.preventDefault();
    loginMsg.textContent = '';
    var btn = loginForm.querySelector('.media-submit');
    btn.disabled = true;

    fetch(AUTH_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({
        username: loginForm.username.value.trim(),
        password: loginForm.password.value
      })
    })
    .then(parseJSON)
    .then(function () { enableEditMode(); })
    .catch(function (err) {
      loginMsg.textContent = err.message;
      loginMsg.className = 'media-form-msg error';
    })
    .finally(function () { btn.disabled = false; });
  });

  logoutBtn.addEventListener('click', function () {
    fetch(AUTH_API, { method: 'DELETE', credentials: 'include' })
      .then(function () { window.location.href = 'index-real.html'; });
  });

  var PAGES_API = 'https://api.reacttf.org/pages.php';
  var downloadBtn = document.getElementById('download-btn');
  var uploadBtn = document.getElementById('upload-btn');
  var csvUpload = document.getElementById('csv-upload');
  var csvMsg = document.getElementById('csv-msg');

  csvUpload.addEventListener('change', function () {
    uploadBtn.disabled = !csvUpload.files.length;
  });

  downloadBtn.addEventListener('click', function () {
    csvMsg.textContent = '';
    fetch(PAGES_API, { credentials: 'include' })
      .then(function (res) {
        if (!res.ok) throw new Error('Download failed.');
        return res.blob();
      })
      .then(function (blob) {
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'pages.csv';
        a.click();
        URL.revokeObjectURL(a.href);
      })
      .catch(function (err) {
        csvMsg.textContent = err.message;
        csvMsg.className = 'media-form-msg error';
      });
  });

  uploadBtn.addEventListener('click', function () {
    if (!csvUpload.files.length) return;
    csvMsg.textContent = '';
    uploadBtn.disabled = true;

    var formData = new FormData();
    formData.append('csv', csvUpload.files[0]);

    fetch(PAGES_API, {
      method: 'POST',
      credentials: 'include',
      body: formData
    })
    .then(function (res) {
      return res.json().then(function (body) {
        if (!res.ok) throw new Error(body.error || 'Upload failed.');
        return body;
      });
    })
    .then(function () {
      csvMsg.textContent = 'pages.csv updated.';
      csvMsg.className = 'media-form-msg success';
      csvUpload.value = '';
      uploadBtn.disabled = true;
    })
    .catch(function (err) {
      csvMsg.textContent = err.message;
      csvMsg.className = 'media-form-msg error';
    })
    .finally(function () { uploadBtn.disabled = !csvUpload.files.length; });
  });
})();
</script>
